name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # No LN_ADDRESS or DATABASE_URL: the build must succeed on the mock rail
      # and the in-process store, which is also how a clean checkout runs.
      - run: npm run build
