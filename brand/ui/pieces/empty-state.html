<!-- rankstr piece: empty state -->
<div class="rs-empty" style="border:1px dashed var(--rs-rule);background:var(--rs-basalt);padding:28px 18px;text-align:center;border-radius:0">
  <h3 style="font-family:var(--font-display);font-weight:700;font-size:1.2rem;letter-spacing:.04em;text-transform:uppercase;color:var(--rs-chalk);margin:0 0 8px">No ranks yet</h3>
  <p style="font-family:var(--font-body);font-size:13px;color:var(--rs-muted);margin:0 0 14px;line-height:1.45">Be the first signal on the plate. Bid sats. Keep the rank.</p>
  <button type="button" style="font-family:var(--font-body);font-weight:600;font-size:13px;padding:10px 14px;background:var(--rs-vermilion);color:#FFF2EC;border:1px solid var(--rs-vermilion);border-radius:0;cursor:pointer">Place first bid</button>
</div>
