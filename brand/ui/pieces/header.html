<!-- rankstr piece: header — uses --rs-* from globals.css -->
<header class="rs-header" style="display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--rs-basalt);border:1px solid var(--rs-rule);border-left:3px solid var(--rs-vermilion);padding:12px 14px;border-radius:0">
  <div style="display:flex;align-items:center;gap:10px">
    <div style="font-family:var(--font-display);font-weight:700;font-size:1.35rem;letter-spacing:.02em;text-transform:lowercase;color:var(--rs-chalk)">
      rankstr<span style="display:inline-block;width:7px;height:7px;background:var(--rs-vermilion);margin-left:3px;vertical-align:super"></span>
    </div>
    <span style="font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding:4px 7px;border:1px solid var(--rs-frost);color:var(--rs-frost)">LIVE</span>
  </div>
  <button type="button" style="font-family:var(--font-body);font-weight:600;font-size:13px;padding:10px 14px;background:var(--rs-vermilion);color:#FFF2EC;border:1px solid var(--rs-vermilion);border-radius:0;cursor:pointer">Climb rank</button>
</header>
