<!-- rankstr piece: bid CTA panel -->
<aside class="rs-bid-cta" style="background:var(--rs-plate);border:1px solid var(--rs-rule);border-left:3px solid var(--rs-vermilion);padding:16px;border-radius:0">
  <h3 style="font-family:var(--font-display);font-weight:700;font-size:1.2rem;letter-spacing:.03em;text-transform:uppercase;color:var(--rs-chalk);margin:0 0 6px">Climb #01</h3>
  <p style="font-family:var(--font-body);font-size:12px;color:var(--rs-muted);margin:0 0 14px;line-height:1.4">Pay the delta. Lightning settles. Bitcoin-only.</p>
  <div style="display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:11px;color:var(--rs-frost);margin-bottom:8px">
    <span>Current</span><span style="color:var(--rs-brass)">210 000 sats</span>
  </div>
  <div style="display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:11px;color:var(--rs-frost);margin-bottom:12px">
    <span>Min next</span><span>210 001 sats</span>
  </div>
  <label style="font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--rs-muted);display:block;margin-bottom:5px" for="rs-bid">Your bid (sats)</label>
  <input id="rs-bid" type="text" placeholder="210001" style="width:100%;font-family:var(--font-mono);font-size:14px;background:var(--rs-basalt);color:var(--rs-chalk);border:1px solid var(--rs-rule);border-radius:0;padding:10px 11px;margin-bottom:12px;box-sizing:border-box">
  <button type="button" style="width:100%;font-family:var(--font-body);font-weight:600;font-size:13px;padding:10px 14px;background:var(--rs-vermilion);color:#FFF2EC;border:1px solid var(--rs-vermilion);border-radius:0;cursor:pointer">Pay &amp; climb</button>
</aside>
